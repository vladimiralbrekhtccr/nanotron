checkpoints:
  checkpoint_interval: 2000
  checkpoints_path: /scratch/vladimir_albrekht/projects/smollm/output/nanotron_500M
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: null
  save_initial_state: false
data_stages:
- data:
    dataset:
      dataset_overwrite_cache: false
      dataset_processing_num_proc_per_process: 96 #64
      hf_dataset_config_name: null
      # hf_dataset_or_datasets: /scratch/vladimir_albrekht/projects/smollm/data/db_11_v2_splited_kazakh/*.json # /scratch/vladimir_albrekht/projects/smollm/data/db_11_v2_splited_kazakh/txt_tq_kaz_2.json
      hf_dataset_or_datasets: /scratch/vladimir_albrekht/projects/smollm/data/db_11_v2_splited_kazakh/*.json
      hf_dataset_splits: train
      text_column_name: text
    num_loading_workers: 96 #32
    seed: 42
  name: Stable Training Stage
  start_training_step: 1
- data:
    dataset:
      dataset_overwrite_cache: false
      dataset_processing_num_proc_per_process: 96 #64
      hf_dataset_config_name: null
      hf_dataset_or_datasets: /scratch/vladimir_albrekht/projects/smollm/data/db_11_v2_splited_kazakh/deepseek_data/*.json
      hf_dataset_splits: train
      text_column_name: text
    num_loading_workers: 96
    seed: 42
  name: Annealing Phase
  start_training_step: 200000
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: debug
  run: tiny_llama_%date_%jobid
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    std: 0.025
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 0
    eos_token_id: 2
    hidden_act: silu
    hidden_size: 896
    initializer_range: 0.02
    intermediate_size: 4864
    is_llama_config: true
    max_position_embeddings: 1024
    # max_window_layers: 24
    num_attention_heads: 14
    num_hidden_layers: 24
    num_key_value_heads: 2
    pad_token_id: 0
    pretraining_tp: 1
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 100512
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 0.0003
    lr_decay_starting_step: null
    lr_decay_steps: 70
    lr_decay_style: cosine
    lr_warmup_steps: 12500 # 5% stepf out of all steps to make warmup
    lr_warmup_style: linear
    min_decay_lr: 1.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.01
  zero_stage: 0
parallelism:
  dp: 2
  expert_parallel_size: 1
  pp: 2
  pp_engine: 1f1b
  tp: 2
  tp_linear_async_communication: true
  tp_mode: REDUCE_SCATTER
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: /scratch/vladimir_albrekht/projects/smollm/models/tokenizers/kk_tokenizer_qwen_2
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 1
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 64
  sequence_length: 1024
  train_steps: 249300 # 12697
  val_check_interval: -1
